name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:
  # Noon UTC daily, after the night's games: the scheduled build refetches
  # the wehoop files and rebuilds the ledger before building (a manual run
  # does too), so last night's games reach the site without a commit. A push
  # builds from the committed ledger, so a code change never waits on a
  # download.
  schedule:
    - cron: '0 12 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - if: github.event_name != 'push'
        run: npm run fetch && npm run ledger
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # IndexNow: tell Bing which pages changed, once the deploy is live. A push
  # pings the root and the named definition pages; the daily refresh, which
  # changes every page's data, sends the whole sitemap. A failed ping never
  # fails the deploy (the script exits 0).
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    # a scheduled run asks for nothing (Drew, 2026-10-24: no scheduled IndexNow --all); a push sends what it changed, a dispatch the whole sitemap
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # (an empty string is falsy in an expression, so the flag is the truthy branch)
      - run: node scripts/indexnow.mjs ${{ github.event_name != 'push' && '--all' || '' }}

  # The share worker (workers/share) bundles src/lib, so it ships with the
  # site. Needs a CLOUDFLARE_API_TOKEN repo secret: a token made from the
  # "Edit Cloudflare Workers" template. The daily data refresh changes no
  # worker code, so it skips this.
  worker:
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.151.3'
          command: deploy -c workers/share/wrangler.jsonc
